name: BTC market validation and collection
run-name: BTC collection (${{ github.event_name }})
on:
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: btc-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: collection-output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and concurrent publication tests
        run: python -m unittest -v test_collector test_persistence
      - name: Record workflow creation time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "WORKFLOW_CREATED_AT=$created" >> "$GITHUB_ENV"
      - name: Collect public market data
        id: collect
        env:
          VALIDATE: ${{ github.event_name != 'schedule' && 'true' || 'false' }}
        run: python collector.py
      - name: Record successful validation
        if: success() && github.event_name != 'schedule'
        run: cp "$OUTPUT_DIR/latest.json" "$OUTPUT_DIR/validation.json"
      - name: Backup current results before publication
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: btc-market-${{ github.run_id }}-${{ github.run_attempt }}
          path: collection-output/
          retention-days: 30
          if-no-files-found: error
      - name: Persist results on latest main with bounded push retries
        if: always() && steps.collect.outcome != 'skipped'
        run: python persist_results.py
